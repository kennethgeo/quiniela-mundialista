name: CI

# Red de seguridad: compila el frontend, valida el backend y corre los tests del
# motor de puntaje en cada PR y push a main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall backend/app
      # Solo pytest: los tests del motor de puntaje stubean las dependencias
      # pesadas (pywebpush y compañía), así que no hace falta instalar todo
      # requirements.txt para verificar la lógica de puntos.
      - run: pip install pytest
      - run: python -m pytest backend/tests -q
